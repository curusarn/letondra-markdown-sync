# On every push to main: run the tests on Windows, build the .exe and publish
# it as a GitHub release (v0.1.<run number>).
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a build still running; only the newest is released.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit + engine tests against the in-memory Drive)
        run: go test ./...
      - name: Build exe
        shell: bash
        run: |
          V="0.1.${{ github.run_number }}"
          echo "V=$V" >> "$GITHUB_ENV"
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$V" -o letondra-markdown-sync.exe ./cmd/letondra-markdown-sync
      - name: Smoke test (start the exe, check its UI answers, stop it)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "lms-smoke"
          $p = Start-Process -FilePath .\letondra-markdown-sync.exe -ArgumentList "-dir `"$dir`" -no-launch" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Get-Content (Join-Path $dir "fatal.txt") -ErrorAction SilentlyContinue; throw "exe exited with $($p.ExitCode)" }
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:47613/" -SkipHttpErrorCheck
          if ($r.StatusCode -ne 403) { throw "UI without token answered $($r.StatusCode), want 403" }
          $tok = Get-Content (Join-Path $dir "ui-token")
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:47613/settings?t=$tok"
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch "Nastavení") { throw "settings page did not render" }
          Get-Content (Join-Path $dir "app.log")
          Stop-Process -Id $p.Id
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The releases API occasionally answers 403 for a moment; retry.
          for i in 1 2 3 4 5; do
            gh release create "v$V" letondra-markdown-sync.exe \
              --target "$GITHUB_SHA" --title "v$V" \
              --notes "Build of ${GITHUB_SHA::7}: $(git log -1 --format=%s)" && exit 0
            sleep $((i * 10))
          done
          exit 1
